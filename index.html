function blkProg(){

  return `<div class="card pad"><b>${tr('Прогресс времени')}</b>${R.map(([l,v])=>{const p=Math.round(v*100);return `<div class="cb"><span>${tr(l)}</span><em>${p}%</em><div class="bar2"><i style="width:${p}%"></i></div></div>`}).join('')}<small>${tr('До конца года осталось {n} дн.').replace('{n}',Math.ceil((end-n)/864e5))}</small></div>`;

function blkLife(){
  const T=80*52,bd=S.set.birth?at(S.set.birth):null;
  if(!bd||isNaN(bd)||bd>new Date())return `<div class="card pad"><b>${tr('Жизнь в неделях')}</b><p class="sub">${tr('Укажи дату рождения в настройках блока (шестерёнка вверху).')}</p></div>`;
  const w=Math.min(T,Math.max(0,Math.floor((new Date()-bd)/(7*864e5))));let cells='';
  for(let i=0;i<T;i++)cells+=i<w?'<u></u>':i===w?'<s></s>':'<i></i>';
  return `<div class="card pad"><b>${tr('Жизнь в неделях')}</b><div class="wk">${cells}</div><small>${tr('Прожито {a} недель из {b} · {c}%').replace('{a}',nf(w)).replace('{b}',nf(T)).replace('{c}',Math.round(w/T*100))}</small><br><small>${tr('Ориентир: 80 лет. Одна клетка — одна неделя.')}</small></div>`;
}

  return `<div class="sum"><div><small>${tr('Серия')}</small><b>${n} ${tr('дн.')}</b></div><div><small>${tr('Активных дней')}</small><b>${act} / ${dim}</b></div><div><small>${tr('Задач выполнено')}</small><b>${cnt}</b></div></div>`;
}
function blkQuote(){const q=QT[qti%QT.length];return `<div class="quote" onclick="qti++;render()"><p>«${q[li()]}»</p><small>${q[3+li()]}</small></div>`}
function calBlocks(c){return (c.prog?blkProg():'')+(c.life?blkLife():'')+(c.count?blkCount():'')+(c.streak?blkStreak():'')+(c.quote?blkQuote():'')}
const nf=n=>(+n).toLocaleString(LOC(),{maximumFractionDigits:2});
const isM=g=>typeof g.tar==='number';
const gv=g=>(g.log||[]).slice().sort((a,b)=>a.d.localeCompare(b.d));
const gcur=g=>{const L=gv(g);return L.length?L[L.length-1].v:g.start};
const gp=(g,v)=>{const d=g.tar-g.start;if(Math.abs(d)<1e-9)return v===g.tar?100:0;return Math.max(0,Math.min(100,Math.round((v-g.start)/d*100)))};
const gprog=g=>isM(g)?gp(g,gcur(g)):(g.p|0);
const gtoggle=id=>{gsel=gsel===id?null:id;render()};
function addLog(id){const g=S.goals.find(x=>x.id===id),v=num($('#gl-v').value),d=$('#gl-d').value||today();
  if(!isFinite(v))return;g.log=(g.log||[]).filter(x=>x.d!==d);g.log.push({d,v});save();render()}
const delLog=(id,d)=>{const g=S.goals.find(x=>x.id===id);g.log=g.log.filter(x=>x.d!==d);save();render()};
function chart(g){
  const L=gv(g),d0=[g.c||today()].concat(L.map(x=>x.d)).sort()[0];
  const pts=[{d:d0,p:0}].concat(L.map(x=>({d:x.d,p:gp(g,x.v)})));
  const W=300,H=140,pl=34,pr=14,pt=16,pb=22,t0=at(d0).getTime(),t1=at(pts[pts.length-1].d).getTime();
  const X=d=>pl+(t1===t0?0:(at(d).getTime()-t0)/(t1-t0))*(W-pl-pr);
  const Y=p=>H-pb-p/100*(H-pt-pb);
  const xy=pts.map(q=>[X(q.d),Y(q.p)]);
  const line=xy.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const end=xy[xy.length-1],area=line+' L'+end[0].toFixed(1)+' '+Y(0)+' L'+xy[0][0].toFixed(1)+' '+Y(0)+' Z';
  const lab=d=>at(d).toLocaleDateString(LOC(),{day:'numeric',month:'short'}),last=pts[pts.length-1];
  const tx='style="fill:var(--hint);font:10px sans-serif"';
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${[0,50,100].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--sep)"/><text x="${pl-6}" y="${Y(v)+3}" text-anchor="end" ${tx}>${v}%</text>`).join('')}<path d="${area}" style="fill:var(--acc);opacity:.14"/><path d="${line}" style="fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/>${xy.map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3.5" style="fill:var(--acc)"/>`).join('')}<text x="${Math.min(end[0],W-pr-10)}" y="${Math.max(end[1]-8,11)}" text-anchor="middle" style="fill:var(--tx);font:700 11px sans-serif">${last.p}%</text><text x="${pl}" y="${H-5}" ${tx}>${lab(pts[0].d)}</text>${pts.length>1?`<text x="${W-pr}" y="${H-5}" text-anchor="end" ${tx}>${lab(last.d)}</text>`:''}</svg>`;
}
function vGoals(){
  const rm=S.set.gs==='ring';
  const detail=g=>{const u=g.unit?' '+esc(g.unit):'',L=gv(g).reverse();
    return `<div class="gd">${chart(g)}
    <div class="row" style="margin-top:12px"><input id="gl-d" type="date" value="${today()}"><input id="gl-v" inputmode="decimal" placeholder="${tr('Новое значение')}"></div>
    <button class="btn full" style="margin-top:0" onclick="addLog(${g.id})">${tr('Записать')}</button>
    <h3 style="margin:14px 4px 2px">${tr('История')}</h3><ul>${L.map(x=>`<li><span>${at(x.d).toLocaleDateString(LOC())}</span><b>${nf(x.v)}${u}</b><small>${gp(g,x.v)}%</small><button class="x" onclick="delLog(${g.id},'${x.d}')">×</button></li>`).join('')}<li><span>${at(g.c||today()).toLocaleDateString(LOC())} · ${tr('Старт')}</span><b>${nf(g.start)}${u}</b><small>0%</small><span style="flex:none;width:30px"></span></li></ul></div>`};
  const card=g=>{
    const m=isM(g),p=gprog(g),u=g.unit?' '+esc(g.unit):'',open=m&&gsel===g.id;
    const due=g.due?tr('до')+' '+at(g.due).toLocaleDateString(LOC()):'';
    let l1=due,l2='';
    if(m){const c=gcur(g);l1=`${tr('Сейчас')}: <b>${nf(c)}${u}</b> · ${nf(g.start)} → ${nf(g.tar)}${u}`;
      l2=(p>=100?tr('Цель достигнута'):tr('Осталось')+': '+nf(Math.abs(g.tar-c))+u)+(due?' · '+due:'')}
    return `<li class="g"><div class="gr">${rm?ring(p):''}<div class="gi"><b>${esc(g.t)}</b><br><small>${l1}</small>${l2?`<br><small>${l2}</small>`:''}${rm?'':`<div class="bar2"><i style="width:${p}%"></i></div><small>${p}%</small>`}</div>${m?`<button class="pill" onclick="gtoggle(${g.id})">${tr(open?'Свернуть':'Обновить')}</button>`:''}<button class="x" onclick="delGoal(${g.id})">×</button></div>
    ${m?(open?detail(g):''):`<input type="range" min="0" max="100" step="5" value="${g.p|0}" onchange="setP(${g.id},this.value)">`}</li>`};
  return `<div class="hd"><h1>${tr('Цели')}</h1></div>
  <div class="card add"><input id="gt" placeholder="${tr('Новая цель')}">
    <div class="row"><input id="gs" inputmode="decimal" placeholder="${tr('Начальное значение')}"><input id="gtar" inputmode="decimal" placeholder="${tr('Целевое значение')}"></div>
    <div class="row"><input id="gu" placeholder="${tr('Единица (кг, км…)')}"><input id="gd" type="date"></div>
    <button class="btn full" style="margin-top:0" onclick="addGoal()">${tr('Добавить')}</button>
    <p class="sub" style="margin-top:10px">${tr('Измеримая цель: укажи старт и цель. Если оставить пустым, будет обычная цель с ползунком.')}</p></div>
  ${S.goals.length?`<div class="card"><ul>${S.goals.map(card).join('')}</ul></div>`:'<p class="empty">'+tr('Целей пока нет. Запиши, к чему идёшь.')+'</p>'}`;
}

function vFin(){
  const sub=seg([['acc','Учёт'],['goal','Цели'],['shop','Покупки']],fs,'setFs');
  if(fs==='goal')return `<div class="hd"><h1>${tr('Финансы')}</h1></div>${sub}
    <div class="card add"><input id="fgt" placeholder="${tr('На что копишь')}"><div class="row"><input id="fga" inputmode="decimal" placeholder="${tr('Сумма цели')}"><button class="btn" onclick="addFG()">${tr('Добавить')}</button></div></div>
    ${S.fg.length?`<div class="card"><ul>${S.fg.map(g=>{const p=Math.min(100,Math.round(g.sv/g.tar*100));return `<li class="g"><div class="gr"><div class="gi"><b>${esc(g.t)}</b><br><small>${fmt(g.sv,g.cur||'UAH')} ${tr('из')} ${fmt(g.tar,g.cur||'UAH')} · ${p}%</small><div class="bar2"><i style="width:${p}%"></i></div></div><button class="pill" onclick="depFG(${g.id})">${tr('Внести')}</button><button class="x" onclick="delFG(${g.id})">×</button></div></li>`}).join('')}</ul></div>`:'<p class="empty">'+tr('Финансовых целей пока нет.')+'</p>'}`;
  if(fs==='shop'){const tot=S.shop.filter(s=>!s.done).reduce((a,s)=>a+C(s.pr,s.cur),0);
    return `<div class="hd"><h1>${tr('Финансы')}</h1></div>${sub}
    <div class="card add"><input id="st" placeholder="${tr('Что купить')}"><div class="row"><input id="sp" inputmode="decimal" placeholder="${tr('Цена')}"><button class="btn" onclick="addSh()">${tr('Добавить')}</button></div></div>
    ${S.shop.length?`<div class="card"><ul>${S.shop.map(s=>`<li class="${s.done?'done':''}"><button class="chk" onclick="togSh(${s.id})">${s.done?'✓':''}</button><span>${esc(s.t)}</span><small>${s.pr?fmt(s.pr,s.cur||'UAH'):''}</small><button class="x" onclick="delSh(${s.id})">×</button></li>`).join('')}</ul></div><p class="sub" style="padding:0 6px">${tr('Осталось купить на')} ${money(tot)}</p>`:'<p class="empty">'+tr('Список покупок пуст.')+'</p>'}`}
  const pm=shiftM(month,-1),sel=m=>S.fin.filter(f=>f.d.slice(0,7)===m);
  const L=sel(month).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id),P=sel(pm);
  const sm=(a,t)=>a.filter(f=>f.type===t).reduce((s,f)=>s+C(f.amt,f.cur),0);
  const inc=sm(L,'inc'),ex=sm(L,'exp'),pex=sm(P,'exp'),mm=Math.max(ex,pex,1);
  const cats={};L.filter(f=>f.type==='exp').forEach(f=>cats[f.cat]=(cats[f.cat]||0)+C(f.amt,f.cur));
  const cl=Object.entries(cats).sort((a,b)=>b[1]-a[1]),mx=cl.length?cl[0][1]:1;
  const diff=pex?Math.round((ex-pex)/pex*100):null;
  return `<div class="hd"><h1>${tr('Финансы')}</h1></div>${sub}
  <div class="nav2"><button class="ic" onclick="setM(-1)">‹</button><b>${monthLabel(month)}</b><button class="ic" onclick="setM(1)">›</button></div>
  <div class="sum"><div><small>${tr('Доход')}</small><b class="inc">${money(inc)}</b></div><div><small>${tr('Расход')}</small><b class="ex">${money(ex)}</b></div><div><small>${tr('Баланс')}</small><b>${money(inc-ex)}</b></div></div>
  <div class="card pad"><b>${tr('Расходы к прошлому месяцу')}</b>
    <div class="cb"><span>${monthLabel(pm)}</span><em>${money(pex)}</em><div class="bar2 g"><i style="width:${pex/mm*100}%"></i></div></div>
    <div class="cb"><span>${monthLabel(month)}</span><em>${money(ex)}</em><div class="bar2"><i style="width:${ex/mm*100}%"></i></div></div>
    <small>${diff===null?tr('За прошлый месяц нет данных.'):diff===0?tr('Столько же, сколько в прошлом месяце.'):tr(diff<0?'На {n}% меньше, чем в прошлом месяце.':'На {n}% больше, чем в прошлом месяце.').replace('{n}',Math.abs(diff))}</small></div>
  ${cl.length?`<div class="card pad"><b>${tr('Расходы по категориям')}</b>${cl.map(([k,v])=>`<div class="cb"><span>${esc(tr(k))}</span><em>${money(v)}</em><div class="bar2"><i style="width:${v/mx*100}%"></i></div></div>`).join('')}</div>`:''}
  <div class="card add"><div class="seg ft"><button data-t="exp" class="${ft==='exp'?'on':''}" onclick="setFt('exp')">${tr('Расход')}</button><button data-t="inc" class="${ft==='inc'?'on':''}" onclick="setFt('inc')">${tr('Доход')}</button></div>
    <div class="row"><input id="fa" inputmode="decimal" placeholder="${tr('Сумма')}"><div class="seg cs" style="margin:0;flex:none">${['UAH','USD'].map(c=>`<button data-c="${c}" class="${(fcur||CD())===c?'on':''}" onclick="setFc('${c}')">${SYM[c]}</button>`).join('')}</div></div><input id="fd" type="date" value="${today()}" style="margin-top:8px">
    <input id="fc" list="cats" placeholder="${tr('Категория')}" style="margin-top:8px"><datalist id="cats">${['Еда','Транспорт','Жильё','Подписки','Здоровье','Зарплата','Другое'].map(c=>'<option>'+tr(c)).join('')}</datalist>
    <input id="fn" placeholder="${tr('Заметка')}" style="margin-top:8px"><button class="btn full" onclick="addFin()">${tr('Добавить запись')}</button></div>
  ${L.length?`<div class="card"><ul>${L.map(f=>`<li><div class="fin-i"><b>${esc(tr(f.cat))}</b><br><small>${at(f.d).toLocaleDateString(LOC())}${f.note?' · '+esc(f.note):''}</small></div><b class="amt ${f.type==='inc'?'inc':'ex'}">${f.type==='inc'?'+':'−'}${fmt(f.amt,f.cur||'UAH')}</b><button class="x" onclick="delFin(${f.id})">×</button></li>`).join('')}</ul></div>`:'<p class="empty">'+tr('В этом месяце записей нет.')+'</p>'}`;
}
function vSet(){const s=S.set;
  return `<div class="hd"><h1>${tr('Настройки')}</h1></div>
  <h3>${tr('Тема')}</h3>${seg([['auto','Авто'],['light','Светлая'],['dark','Тёмная']],s.theme,'setT')}
  <h3>${tr('Акцентный цвет')}</h3><div class="card"><div class="sw">${['#0a84ff','#30d158','#ff9f0a','#ff453a','#bf5af2','#ff375f'].map(c=>`<button class="${c===s.acc?'on':''}" style="background:${c}" onclick="setS('acc','${c}')"></button>`).join('')}<input type="color" value="${s.acc}" onchange="setS('acc',this.value)"></div></div>
  <h3>${tr('Язык')}</h3>${seg([['ru','Русский'],['en','English'],['uk','Українська']],s.lang,'setL')}<h3>${tr('Прогресс целей')}</h3>${seg([['ring','Круг'],['bar','Полоса']],s.gs,'setG')}
  <h3>${tr('Валюта')}</h3>${seg([['UAH','₴ Гривна'],['USD','$ Доллар']],CD(),'setCu')}<div class="sub" style="padding:0 10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px"><span>${S.rate?tr('Курс')+': 1 $ = '+fmt(S.rate.v,'UAH')+(S.rate.d?' · '+S.rate.d:''):tr('Курс не получен, используется приблизительный')}</span><button class="pill" onclick="getRate(true)">${tr('Обновить курс')}</button></div><h3>${tr('Фон')}</h3><div class="card"><div class="tg"><span>${tr('Анимация фона')}</span><button class="sw2 ${s.anim!==false?'on':''}" onclick="setS('anim',${s.anim===false})"></button></div></div><h3>${tr('Резервная копия')}</h3><div class="card"><div class="row" style="padding:12px 0"><button class="pill" style="flex:1" onclick="exp()">${tr('Скопировать данные')}</button><button class="pill" style="flex:1" onclick="imp()">${tr('Восстановить')}</button></div></div>`;
}
const setT=v=>setS('theme',v),setG=v=>setS('gs',v),setL=v=>setS('lang',v),setCu=v=>{fcur=null;setS('cur',v)};

function render(){document.documentElement.lang=S.set.lang;
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${IC[k]}</svg><span>${tr(l)}</span></button>`).join('');
  $('#app').innerHTML='<div class="v">'+{day:vDay,cal:vCal,goals:vGoals,fin:vFin,set:vSet}[tab]()+'</div>';fit()
}
function fit(){document.querySelectorAll('h1').forEach(h=>{h.style.fontSize='';let z=parseFloat(getComputedStyle(h).fontSize);while(h.scrollWidth>h.clientWidth+2&&z>22){z-=1;h.style.fontSize=z+'px'}})}
if(window.addEventListener)window.addEventListener('resize',fit);
S.fin.forEach(f=>{if(!f.cur)f.cur='UAH'});
applyTheme();render();getRate();
</script>
</body>
</html>
