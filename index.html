<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мой день</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--acc:#0a84ff;--acc2:color-mix(in srgb,var(--acc) 50%,#bf5af2);--glass:rgba(255,255,255,.55);--edge:rgba(255,255,255,.75);--hi:rgba(255,255,255,.95);--bg:#e9ecf5;--card:#fff;--tx:#000;--hint:#8e8e93;--sep:rgba(60,60,67,.14);--fill:rgba(120,120,128,.12);--ok:#30d158;--bad:#ff453a}
[data-theme=dark]{--glass:rgba(44,46,60,.42);--edge:rgba(255,255,255,.13);--hi:rgba(255,255,255,.2);--bg:#06070b;--card:#1c1c1e;--tx:#fff;--hint:#98989f;--sep:rgba(84,84,88,.55);--fill:rgba(120,120,128,.24)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:17px/1.35 -apple-system,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));transition:background .3s,color .3s}
#app{max-width:560px;margin:auto;padding:14px 16px}
.v{animation:f .3s ease both}@keyframes f{from{opacity:0;transform:translateY(6px)}}
h1{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:8px 4px 18px}
.sub,small{color:var(--hint);font-size:14px}
h3{font-size:13px;font-weight:600;color:var(--hint);margin:0 10px 6px}
b{font-weight:700}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .15s,opacity .15s}
button:active{transform:scale(.96);opacity:.75}
input{width:100%;min-width:0;font:inherit;color:var(--tx);background:var(--fill);border:0;border-radius:12px;padding:11px 14px;outline:0}
input[type=color]{width:44px;height:36px;padding:2px;border-radius:50%}
.card{background:var(--card);border-radius:22px;padding:6px 16px;margin-bottom:16px}
.pad{padding:16px}.pad>b{display:block;margin-bottom:10px}
.add{padding:12px}.add input{margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}.row+.row,.row+input,input+.row{margin-top:8px}
.btn{background:var(--acc);color:#fff;border-radius:14px;padding:11px 16px;font-weight:600;white-space:nowrap}
.full{width:100%;margin-top:10px}
.pill{background:var(--fill);color:var(--acc);border-radius:20px;padding:7px 14px;font-weight:600;font-size:15px}
.chip{background:var(--fill);border-radius:20px;padding:8px 14px;font-size:15px;font-weight:600;flex:1;text-align:left}
.chip.p1{color:#ff9f0a}.chip.p2{color:var(--bad)}
ul{list-style:none;padding:0}
li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:.5px solid var(--sep)}
li:last-child{border:0}
li>span,.gi,.fin-i{flex:1;min-width:0;word-break:break-word}
li.done>span{color:var(--hint);text-decoration:line-through}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--hint);flex:none;color:#fff;font-size:14px;line-height:1}
.chk.p1{border-color:#ff9f0a}.chk.p2{border-color:var(--bad)}
li.done .chk{background:var(--acc);border-color:var(--acc)}
.x{color:var(--hint);font-size:22px;padding:0 4px}
.empty{color:var(--hint);text-align:center;padding:26px 0;font-size:15px}
.quote{padding:14px 18px;border-radius:20px;background:var(--fill);margin:4px 0 8px;cursor:pointer}
.quote p{font-size:15px;font-weight:600;line-height:1.4;margin-bottom:4px}
.nav2{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ic{font-size:26px;width:40px;height:40px;border-radius:50%;background:var(--fill);line-height:1;color:var(--acc)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px;text-align:center}
.cal small{padding:4px 0}
.cd{position:relative;aspect-ratio:1;border-radius:14px;font-size:16px;font-weight:500;background:var(--card)}
.cd.today{color:var(--acc);font-weight:800}
.cd.sel{background:var(--acc);color:#fff}
.cd u{position:absolute;left:50%;margin-left:-2.5px;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--hint)}
.cd u.all{background:var(--ok)}.cd.sel u{background:#fff}
.g{display:block}.gr{display:flex;align-items:center;gap:12px}
.rg{width:56px;height:56px;flex:none}
.rb{fill:none;stroke:var(--fill);stroke-width:6}
.rf{fill:none;stroke:var(--acc);stroke-width:6;stroke-linecap:round;transition:stroke-dasharray .4s}
.rg text{fill:var(--tx);font:700 14px -apple-system,system-ui,sans-serif}
input[type=range]{padding:0;background:none;accent-color:var(--acc);margin-top:8px}
.bar2{height:8px;border-radius:4px;background:var(--fill);overflow:hidden;margin-top:6px}
.bar2 i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .4s}
.bar2.g i{background:var(--hint)}
.cb{margin-bottom:10px;display:grid;grid-template-columns:1fr auto}.cb .bar2{grid-column:1/3}.cb em{font-style:normal;font-weight:600}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.sum div{background:var(--card);border-radius:18px;padding:12px}.sum small{display:block}.sum b{font-size:16px}
.inc{color:var(--ok)}.ex{color:var(--bad)}.amt{white-space:nowrap}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:7px 4px;border-radius:10px;font-size:15px;font-weight:600}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sw{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 0}
.sw button{width:34px;height:34px;border-radius:50%}
.sw button.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--tx)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 72%,transparent);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-top:.5px solid var(--sep)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--hint);font-size:10px;font-weight:600}
nav button.on{color:var(--acc)}
nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#ov{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);color:#fff;font-size:44px;font-weight:800;letter-spacing:-.02em;opacity:0;pointer-events:none;transition:opacity .4s}
#ov.on{opacity:1}
/* Liquid Glass */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(70% 45% at 10% -5%,color-mix(in srgb,var(--acc) 42%,transparent),transparent 70%),radial-gradient(60% 40% at 105% 35%,color-mix(in srgb,var(--acc2) 32%,transparent),transparent 70%),radial-gradient(70% 40% at 0% 105%,color-mix(in srgb,var(--acc) 22%,transparent),transparent 70%),var(--bg)}
.card,.sum div,.quote,.seg,nav,.cd{background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:0 8px 30px rgba(0,0,0,.08),inset 0 1px 0 var(--hi)}
.pill,.chip,.ic{background:var(--glass);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.seg button.on{background:color-mix(in srgb,var(--tx) 12%,var(--glass));box-shadow:inset 0 1px 0 var(--hi),0 2px 8px rgba(0,0,0,.12)}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.cd.sel{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
li.done .chk{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent}
.bar2 i{background:linear-gradient(90deg,var(--acc),var(--acc2))}
.bar2.g i{background:var(--hint)}
.rf{stroke:url(#rgd)}
nav{left:12px;right:12px;max-width:536px;margin:0 auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:30px}
nav button{padding:6px 0;border-radius:24px}
nav button.on{background:var(--fill)}
</style>
</head>

<script>
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();try{tg.onEvent('themeChanged',()=>applyTheme())}catch(e){}}
const KEY='miniapp-v1';
const LANG0=()=>{const l=String((tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.language_code)||navigator.language||'ru').slice(0,2);return ['ru','uk','en'].includes(l)?l:'en'};
const LOC=()=>({ru:'ru-RU',en:'en-US',uk:'uk-UA'}[S.set.lang]||'ru-RU');
const li=()=>({ru:0,en:1,uk:2}[S.set.lang]||0);
const TR=[['Задачи','Tasks','Завдання'],['Календарь','Calendar','Календар'],['Цели','Goals','Цілі'],['Финансы','Finance','Фінанси'],['Настройки','Settings','Налаштування'],['Обычный','Normal','Звичайний'],['Важный','Important','Важливий'],['Срочный','Urgent','Терміновий'],['Сегодня','Today','Сьогодні'],['Вчера','Yesterday','Вчора'],['Завтра','Tomorrow','Завтра'],['выполнено {a} из {b}','{a} of {b} done','виконано {a} з {b}'],['Новая задача','New task','Нова задача'],['Добавить','Add','Додати'],['Перенести невыполненные со вчера ({n})','Move unfinished from yesterday ({n})','Перенести невиконані з учора ({n})'],['На этот день задач нет. Добавь первую выше.','No tasks for this day. Add the first one above.','На цей день задач немає. Додай першу вище.'],['Нажми на день, чтобы открыть его задачи. Точка под числом — в этот день есть задачи, зелёная — все выполнены.','Tap a day to open its tasks. A dot under the number means there are tasks that day; a green dot means all are done.','Натисни на день, щоб відкрити його задачі. Крапка під числом — у цей день є задачі, зелена — усі виконані.'],['Новая цель','New goal','Нова ціль'],['до','by','до'],['Целей пока нет. Запиши, к чему идёшь.','No goals yet. Write down what you’re working toward.','Цілей поки немає. Запиши, до чого йдеш.'],['Учёт','Tracker','Облік'],['Покупки','Shopping','Покупки'],['На что копишь','What are you saving for','На що збираєш'],['Сумма цели','Target amount','Сума цілі'],['из','of','з'],['Внести','Add funds','Внести'],['Финансовых целей пока нет.','No financial goals yet.','Фінансових цілей поки немає.'],['Что купить','What to buy','Що купити'],['Цена','Price','Ціна'],['Осталось купить на','Left to buy:','Залишилось купити на'],['Список покупок пуст.','Your shopping list is empty.','Список покупок порожній.'],['Доход','Income','Дохід'],['Расход','Expense','Витрата'],['Баланс','Balance','Баланс'],['Расходы к прошлому месяцу','Spending vs. last month','Витрати до минулого місяця'],['За прошлый месяц нет данных.','No data for last month.','За минулий місяць немає даних.'],['Столько же, сколько в прошлом месяце.','Same as last month.','Стільки ж, скільки минулого місяця.'],['На {n}% меньше, чем в прошлом месяце.','{n}% less than last month.','На {n}% менше, ніж минулого місяця.'],['На {n}% больше, чем в прошлом месяце.','{n}% more than last month.','На {n}% більше, ніж минулого місяця.'],['Расходы по категориям','Spending by category','Витрати за категоріями'],['Сумма','Amount','Сума'],['Категория','Category','Категорія'],['Заметка','Note','Нотатка'],['Добавить запись','Add entry','Додати запис'],['В этом месяце записей нет.','No entries this month.','У цьому місяці записів немає.'],['Еда','Food','Їжа'],['Транспорт','Transport','Транспорт'],['Жильё','Housing','Житло'],['Подписки','Subscriptions','Підписки'],['Здоровье','Health','Здоров’я'],['Зарплата','Salary','Зарплата'],['Другое','Other','Інше'],['Тема','Theme','Тема'],['Авто','Auto','Авто'],['Светлая','Light','Світла'],['Тёмная','Dark','Темна'],['Акцентный цвет','Accent color','Акцентний колір'],['Язык','Language','Мова'],['Прогресс целей','Goal progress','Прогрес цілей'],['Круг','Ring','Коло'],['Полоса','Bar','Смуга'],['Резервная копия','Backup','Резервна копія'],['Скопировать данные','Copy data','Скопіювати дані'],['Восстановить','Restore','Відновити'],['Красавчик','Nice work','Молодець'],['Удалить цель?','Delete this goal?','Видалити ціль?'],['Сколько внести?','How much to add?','Скільки внести?'],['Данные скопированы. Сохрани их в заметки.','Data copied. Save it to your notes.','Дані скопійовано. Збережи їх у нотатки.'],['Скопируй данные:','Copy your data:','Скопіюй дані:'],['Вставь скопированные данные','Paste your copied data','Встав скопійовані дані'],['Не удалось прочитать данные','Couldn’t read the data','Не вдалося прочитати дані']];
const D={en:{},uk:{}};TR.forEach(r=>{D.en[r[0]]=r[1];D.uk[r[0]]=r[2]});
const tr=x=>{const d=D[S.set.lang];return (d&&d[x])||x};
let S={tasks:[],goals:[],fin:[],fg:[],shop:[],set:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
S.set=Object.assign({theme:'auto',acc:'#0a84ff',gs:'ring',lang:LANG0()},S.set);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.toLocaleDateString('sv-SE');
const today=()=>iso(new Date());
const at=s=>new Date(s+'T12:00:00');
const shift=(s,n)=>{const d=at(s);d.setDate(d.getDate()+n);return iso(d)};
const shiftM=(m,n)=>{const d=at(m+'-15');d.setMonth(d.getMonth()+n);return iso(d).slice(0,7)};
const uid=()=>Date.now()+Math.floor(Math.random()*1000);
const CUR=''; // символ валюты, например '₴' или '$'
const money=n=>n.toLocaleString(LOC(),{maximumFractionDigits:2})+(CUR?' '+CUR:'');
const num=v=>parseFloat(String(v||'').replace(',','.'));
const hp=()=>{try{tg.HapticFeedback.impactOccurred('light')}catch(e){}};
const PN=['Обычный','Важный','Срочный'];
const Q=[['Единственный способ делать великие дела — любить то, что ты делаешь.', 'The only way to do great work is to love what you do.', 'Єдиний спосіб робити великі справи — любити те, що робиш.', 'Стив Джобс', 'Steve Jobs', 'Стів Джобс'], ['Дисциплина — это мост между целями и достижениями.', 'Discipline is the bridge between goals and accomplishment.', 'Дисципліна — це міст між цілями та досягненнями.', 'Джим Рон', 'Jim Rohn', 'Джим Рон'], ['Препятствие на пути становится путём.', 'What stands in the way becomes the way.', 'Перешкода на шляху стає шляхом.', 'Марк Аврелий', 'Marcus Aurelius', 'Марк Аврелій'], ['Трудности укрепляют разум так же, как труд укрепляет тело.', 'Difficulties strengthen the mind, as labor does the body.', 'Труднощі зміцнюють розум так само, як праця — тіло.', 'Сенека', 'Seneca', 'Сенека'], ['Мы — то, что мы делаем постоянно. Совершенство — это привычка.', 'We are what we repeatedly do. Excellence is a habit.', 'Ми — це те, що ми робимо постійно. Досконалість — це звичка.', 'Уилл Дюрант', 'Will Durant', 'Вілл Дюрант'], ['Не считай дни, а делай так, чтобы дни считались.', 'Don’t count the days, make the days count.', 'Не лічи дні, а роби так, щоб дні мали значення.', 'Мухаммед Али', 'Muhammad Ali', 'Мухаммед Алі'], ['Цена — это то, что ты платишь. Ценность — то, что ты получаешь.', 'Price is what you pay. Value is what you get.', 'Ціна — це те, що ти платиш. Цінність — те, що ти отримуєш.', 'Уоррен Баффет', 'Warren Buffett', 'Воррен Баффет'], ['Начни там, где ты есть. Используй то, что у тебя есть. Делай, что можешь.', 'Start where you are. Use what you have. Do what you can.', 'Почни там, де ти є. Використовуй те, що маєш. Роби, що можеш.', 'Артур Эш', 'Arthur Ashe', 'Артур Еш']];
let tab='day',day=today(),month=today().slice(0,7),cm=month,ft='exp',fs='acc',pr=0,qi=new Date().getDate()%Q.length;
const IC={day:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="4"/><path d="M3 10h18M8 3v4M16 3v4"/>',goals:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',fin:'<rect x="3" y="6" width="18" height="13" rx="4"/><path d="M3 11h18M16 15h2"/>',set:'<path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/>'};
const TABS=[['day','Задачи'],['cal','Календарь'],['goals','Цели'],['fin','Финансы'],['set','Настройки']];

function applyTheme(){
  let t=S.set.theme;
  if(t==='auto')t=(tg&&tg.colorScheme)||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  document.documentElement.dataset.theme=t;
  document.documentElement.style.setProperty('--acc',S.set.acc);
  try{tg.setHeaderColor(t==='dark'?'#06070b':'#e9ecf5');tg.setBackgroundColor(t==='dark'?'#06070b':'#e9ecf5')}catch(e){}
}
function dayLabel(s){const t=today();
  if(s===t)return tr('Сегодня');if(s===shift(t,-1))return tr('Вчера');if(s===shift(t,1))return tr('Завтра');
  return at(s).toLocaleDateString(LOC(),{day:'numeric',month:'long'})}
const monthLabel=m=>at(m+'-15').toLocaleDateString(LOC(),{month:'long',year:'numeric'});
const seg=(o,cur,fn)=>`<div class="seg">${o.map(([v,l])=>`<button class="${v===cur?'on':''}" onclick="${fn}('${v}')">${tr(l)}</button>`).join('')}</div>`;
const ring=p=>`<svg class="rg" viewBox="0 0 60 60"><defs><linearGradient id="rgd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--acc)"/><stop offset="1" style="stop-color:var(--acc2)"/></linearGradient></defs><circle cx="30" cy="30" r="26" class="rb"/><circle cx="30" cy="30" r="26" class="rf" transform="rotate(-90 30 30)" stroke-dasharray="${p*1.6336} 163.36"/><text x="30" y="35" text-anchor="middle">${p}%</text></svg>`;
const nice=()=>{$('#ov').textContent=tr('Красавчик');$('#ov').classList.add('on');setTimeout(()=>$('#ov').classList.remove('on'),2600)};

/* Действия */
const go=t=>{tab=t;if(t==='cal')cm=day.slice(0,7);render()};
const setCM=n=>{cm=shiftM(cm,n);render()};
const pick=d=>{day=d;tab='day';render()};
const cyc=()=>{pr=(pr+1)%3;render();$('#nt').focus()};
function addTask(){const v=$('#nt').value.trim();if(!v)return;S.tasks.push({id:uid(),d:day,t:v,done:false,p:pr});pr=0;save();render();$('#nt').focus()}
function tog(id){const t=S.tasks.find(x=>x.id===id);t.done=!t.done;save();hp();render();
  if(t.done&&S.tasks.filter(x=>x.d===t.d).every(x=>x.done))nice()}
const delTask=id=>{S.tasks=S.tasks.filter(x=>x.id!==id);save();render()};
function carry(){const y=shift(day,-1);S.tasks.filter(t=>t.d===y&&!t.done).forEach(t=>t.d=day);save();render()}
function addGoal(){const t=$('#gt').value.trim();if(!t)return;S.goals.push({id:uid(),t,due:$('#gd').value,p:0});save();render()}
const setP=(id,v)=>{S.goals.find(g=>g.id===id).p=+v;save();render()};
const delGoal=id=>{if(confirm(tr('Удалить цель?'))){S.goals=S.goals.filter(g=>g.id!==id);save();render()}};
const setFs=v=>{fs=v;render()};
const setFt=t=>{ft=t;document.querySelectorAll('.ft button').forEach(b=>b.classList.toggle('on',b.dataset.t===t))};
function addFin(){const a=num($('#fa').value);if(!(a>0))return;
  S.fin.push({id:uid(),d:$('#fd').value||today(),type:ft,amt:a,cat:$('#fc').value.trim()||'Другое',note:$('#fn').value.trim()});save();render()}
const delFin=id=>{S.fin=S.fin.filter(f=>f.id!==id);save();render()};
const setM=n=>{month=shiftM(month,n);render()};
function addFG(){const t=$('#fgt').value.trim(),a=num($('#fga').value);if(!t||!(a>0))return;S.fg.push({id:uid(),t,tar:a,sv:0});save();render()}
function depFG(id){const v=num(prompt(tr('Сколько внести?')));if(!(v>0))return;S.fg.find(g=>g.id===id).sv+=v;save();render()}
const delFG=id=>{S.fg=S.fg.filter(g=>g.id!==id);save();render()};
function addSh(){const t=$('#st').value.trim();if(!t)return;S.shop.push({id:uid(),t,pr:num($('#sp').value)||0,done:false});save();render()}
const togSh=id=>{const s=S.shop.find(x=>x.id===id);s.done=!s.done;save();render()};
const delSh=id=>{S.shop=S.shop.filter(x=>x.id!==id);save();render()};
const setS=(k,v)=>{S.set[k]=v;save();applyTheme();render()};
function exp(){const j=JSON.stringify(S);
  navigator.clipboard.writeText(j).then(()=>alert(tr('Данные скопированы. Сохрани их в заметки.')),()=>prompt(tr('Скопируй данные:'),j))}
function imp(){const j=prompt(tr('Вставь скопированные данные'));if(!j)return;
  try{const o=JSON.parse(j);S=Object.assign({tasks:[],goals:[],fin:[],fg:[],shop:[],set:{}},o);S.set=Object.assign({theme:'auto',acc:'#0a84ff',gs:'ring',lang:LANG0()},S.set);save();applyTheme();render()}
  catch(e){alert(tr('Не удалось прочитать данные'))}}

/* Экраны */
function vDay(){
  const L=S.tasks.filter(t=>t.d===day).sort((a,b)=>a.done-b.done||(b.p|0)-(a.p|0)),n=L.filter(t=>t.done).length;
  const c=day===today()?S.tasks.filter(t=>t.d===shift(day,-1)&&!t.done).length:0,q=Q[qi];
  return `<div class="hd"><div><h1>${dayLabel(day)}</h1><div class="sub">${at(day).toLocaleDateString(LOC(),{weekday:'long'})}${L.length?' · '+tr('выполнено {a} из {b}').replace('{a}',n).replace('{b}',L.length):''}</div></div>${day!==today()?'<button class="pill" onclick="day=today();render()">'+tr('Сегодня')+'</button>':''}</div>
  <div class="card add"><input id="nt" placeholder="${tr('Новая задача')}" onkeydown="if(event.key==='Enter')addTask()">
    <div class="row"><button class="chip p${pr}" onclick="cyc()">${tr(PN[pr])}</button><button class="btn" onclick="addTask()">${tr('Добавить')}</button></div></div>
  ${c?`<button class="pill full" style="margin:-4px 0 16px" onclick="carry()">${tr('Перенести невыполненные со вчера ({n})').replace('{n}',c)}</button>`:''}
  ${L.length?`<div class="card"><ul>${L.map(t=>`<li class="${t.done?'done':''}"><button class="chk p${t.p|0}" onclick="tog(${t.id})">${t.done?'✓':''}</button><span>${esc(t.t)}</span><button class="x" onclick="delTask(${t.id})">×</button></li>`).join('')}</ul></div>`:'<p class="empty">'+tr('На этот день задач нет. Добавь первую выше.')+'</p>'}
  <div class="quote" onclick="qi=(qi+1)%Q.length;render()"><p>«${q[li()]}»</p><small>${q[3+li()]}</small></div>`;
}
function vCal(){
  const first=at(cm+'-01'),dim=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
  const off=(first.getDay()+6)%7,t=today();let cells='';
  for(let i=0;i<off;i++)cells+='<i></i>';
  for(let n=1;n<=dim;n++){const d=cm+'-'+String(n).padStart(2,'0'),L=S.tasks.filter(x=>x.d===d);
    cells+=`<button class="cd${d===t?' today':''}${d===day?' sel':''}" onclick="pick('${d}')">${n}${L.length?`<u class="${L.every(x=>x.done)?'all':''}"></u>`:''}</button>`}
  return `<div class="hd"><h1>${tr('Календарь')}</h1></div>
  <div class="nav2"><button class="ic" onclick="setCM(-1)">‹</button><b>${monthLabel(cm)}</b><button class="ic" onclick="setCM(1)">›</button></div>
  <div class="cal">${[...Array(7)].map((_,i)=>new Date(2024,0,1+i).toLocaleDateString(LOC(),{weekday:'short'})).map(w=>`<small>${w}</small>`).join('')}${cells}</div>
  <p class="sub" style="padding:0 6px">${tr('Нажми на день, чтобы открыть его задачи. Точка под числом — в этот день есть задачи, зелёная — все выполнены.')}</p>`;
}
function vGoals(){
  const ringM=S.set.gs==='ring';
  return `<div class="hd"><h1>${tr('Цели')}</h1></div>
  <div class="card add"><input id="gt" placeholder="${tr('Новая цель')}"><div class="row"><input id="gd" type="date"><button class="btn" onclick="addGoal()">${tr('Добавить')}</button></div></div>
  ${S.goals.length?`<div class="card"><ul>${S.goals.map(g=>`<li class="g"><div class="gr">${ringM?ring(g.p):''}<div class="gi"><b>${esc(g.t)}</b><br><small>${g.due?tr('до')+' '+at(g.due).toLocaleDateString(LOC())+(ringM?'':' · '):''}${ringM?'':g.p+'%'}</small>${ringM?'':`<div class="bar2"><i style="width:${g.p}%"></i></div>`}</div><button class="x" onclick="delGoal(${g.id})">×</button></div>
    <input type="range" min="0" max="100" step="5" value="${g.p}" onchange="setP(${g.id},this.value)"></li>`).join('')}</ul></div>`:'<p class="empty">'+tr('Целей пока нет. Запиши, к чему идёшь.')+'</p>'}`;
}
function vFin(){
  const sub=seg([['acc','Учёт'],['goal','Цели'],['shop','Покупки']],fs,'setFs');
  if(fs==='goal')return `<div class="hd"><h1>${tr('Финансы')}</h1></div>${sub}
    <div class="card add"><input id="fgt" placeholder="${tr('На что копишь')}"><div class="row"><input id="fga" inputmode="decimal" placeholder="${tr('Сумма цели')}"><button class="btn" onclick="addFG()">${tr('Добавить')}</button></div></div>
    ${S.fg.length?`<div class="card"><ul>${S.fg.map(g=>{const p=Math.min(100,Math.round(g.sv/g.tar*100));return `<li class="g"><div class="gr"><div class="gi"><b>${esc(g.t)}</b><br><small>${money(g.sv)} ${tr('из')} ${money(g.tar)} · ${p}%</small><div class="bar2"><i style="width:${p}%"></i></div></div><button class="pill" onclick="depFG(${g.id})">${tr('Внести')}</button><button class="x" onclick="delFG(${g.id})">×</button></div></li>`}).join('')}</ul></div>`:'<p class="empty">'+tr('Финансовых целей пока нет.')+'</p>'}`;
  if(fs==='shop'){const tot=S.shop.filter(s=>!s.done).reduce((a,s)=>a+s.pr,0);
    return `<div class="hd"><h1>${tr('Финансы')}</h1></div>${sub}
    <div class="card add"><input id="st" placeholder="${tr('Что купить')}"><div class="row"><input id="sp" inputmode="decimal" placeholder="${tr('Цена')}"><button class="btn" onclick="addSh()">${tr('Добавить')}</button></div></div>
    ${S.shop.length?`<div class="card"><ul>${S.shop.map(s=>`<li class="${s.done?'done':''}"><button class="chk" onclick="togSh(${s.id})">${s.done?'✓':''}</button><span>${esc(s.t)}</span><small>${s.pr?money(s.pr):''}</small><button class="x" onclick="delSh(${s.id})">×</button></li>`).join('')}</ul></div><p class="sub" style="padding:0 6px">${tr('Осталось купить на')} ${money(tot)}</p>`:'<p class="empty">'+tr('Список покупок пуст.')+'</p>'}`}
  const pm=shiftM(month,-1),sel=m=>S.fin.filter(f=>f.d.slice(0,7)===m);
  const L=sel(month).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id),P=sel(pm);
  const sm=(a,t)=>a.filter(f=>f.type===t).reduce((s,f)=>s+f.amt,0);
  const inc=sm(L,'inc'),ex=sm(L,'exp'),pex=sm(P,'exp'),mm=Math.max(ex,pex,1);
  const cats={};L.filter(f=>f.type==='exp').forEach(f=>cats[f.cat]=(cats[f.cat]||0)+f.amt);
  const cl=Object.entries(cats).sort((a,b)=>b[1]-a[1]),mx=cl.length?cl[0][1]:1;
  const diff=pex?Math.round((ex-pex)/pex*100):null;
  return `<div class="hd"><h1>${tr('Финансы')}</h1></div>${sub}
  <div class="nav2"><button class="ic" onclick="setM(-1)">‹</button><b>${monthLabel(month)}</b><button class="ic" onclick="setM(1)">›</button></div>
  <div class="sum"><div><small>${tr('Доход')}</small><b class="inc">${money(inc)}</b></div><div><small>${tr('Расход')}</small><b class="ex">${money(ex)}</b></div><div><small>${tr('Баланс')}</small><b>${money(inc-ex)}</b></div></div>
  <div class="card pad"><b>${tr('Расходы к прошлому месяцу')}</b>
    <div class="cb"><span>${monthLabel(pm)}</span><em>${money(pex)}</em><div class="bar2 g"><i style="width:${pex/mm*100}%"></i></div></div>
    <div class="cb"><span>${monthLabel(month)}</span><em>${money(ex)}</em><div class="bar2"><i style="width:${ex/mm*100}%"></i></div></div>
    <small>${diff===null?tr('За прошлый месяц нет данных.'):diff===0?tr('Столько же, сколько в прошлом месяце.'):tr(diff<0?'На {n}% меньше, чем в прошлом месяце.':'На {n}% больше, чем в прошлом месяце.').replace('{n}',Math.abs(diff))}</small></div>
  ${cl.length?`<div class="card pad"><b>${tr('Расходы по категориям')}</b>${cl.map(([k,v])=>`<div class="cb"><span>${esc(tr(k))}</span><em>${money(v)}</em><div class="bar2"><i style="width:${v/mx*100}%"></i></div></div>`).join('')}</div>`:''}
  <div class="card add"><div class="seg ft"><button data-t="exp" class="${ft==='exp'?'on':''}" onclick="setFt('exp')">${tr('Расход')}</button><button data-t="inc" class="${ft==='inc'?'on':''}" onclick="setFt('inc')">${tr('Доход')}</button></div>
    <div class="row"><input id="fa" inputmode="decimal" placeholder="${tr('Сумма')}"><input id="fd" type="date" value="${today()}"></div>
    <input id="fc" list="cats" placeholder="${tr('Категория')}" style="margin-top:8px"><datalist id="cats">${['Еда','Транспорт','Жильё','Подписки','Здоровье','Зарплата','Другое'].map(c=>'<option>'+tr(c)).join('')}</datalist>
    <input id="fn" placeholder="${tr('Заметка')}" style="margin-top:8px"><button class="btn full" onclick="addFin()">${tr('Добавить запись')}</button></div>
  ${L.length?`<div class="card"><ul>${L.map(f=>`<li><div class="fin-i"><b>${esc(tr(f.cat))}</b><br><small>${at(f.d).toLocaleDateString(LOC())}${f.note?' · '+esc(f.note):''}</small></div><b class="amt ${f.type==='inc'?'inc':'ex'}">${f.type==='inc'?'+':'−'}${money(f.amt)}</b><button class="x" onclick="delFin(${f.id})">×</button></li>`).join('')}</ul></div>`:'<p class="empty">'+tr('В этом месяце записей нет.')+'</p>'}`;
}
function vSet(){const s=S.set;
  return `<div class="hd"><h1>${tr('Настройки')}</h1></div>
  <h3>${tr('Тема')}</h3>${seg([['auto','Авто'],['light','Светлая'],['dark','Тёмная']],s.theme,'setT')}
  <h3>${tr('Акцентный цвет')}</h3><div class="card"><div class="sw">${['#0a84ff','#30d158','#ff9f0a','#ff453a','#bf5af2','#ff375f'].map(c=>`<button class="${c===s.acc?'on':''}" style="background:${c}" onclick="setS('acc','${c}')"></button>`).join('')}<input type="color" value="${s.acc}" onchange="setS('acc',this.value)"></div></div>
  <h3>${tr('Язык')}</h3>${seg([['ru','Русский'],['en','English'],['uk','Українська']],s.lang,'setL')}<h3>${tr('Прогресс целей')}</h3>${seg([['ring','Круг'],['bar','Полоса']],s.gs,'setG')}
  <h3>${tr('Резервная копия')}</h3><div class="card"><div class="row" style="padding:12px 0"><button class="pill" style="flex:1" onclick="exp()">${tr('Скопировать данные')}</button><button class="pill" style="flex:1" onclick="imp()">${tr('Восстановить')}</button></div></div>`;
}
const setT=v=>setS('theme',v),setG=v=>setS('gs',v),setL=v=>setS('lang',v);

function render(){document.documentElement.lang=S.set.lang;
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${IC[k]}</svg><span>${tr(l)}</span></button>`).join('');
  $('#app').innerHTML='<div class="v">'+{day:vDay,cal:vCal,goals:vGoals,fin:vFin,set:vSet}[tab]()+'</div>';
}
applyTheme();render();
</script>
</body>
</html>
